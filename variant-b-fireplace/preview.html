<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202020">
    <meta name="description" content="Preview of the three coordinated fireplace ad creatives.">
    <title>Fireplace Ad Preview</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="preview-page">
    <main class="preview-frame">
      <div class="preview-stage" id="preview-stage">
        <iframe class="preview-left" src="left.html" title="Left skyscraper"></iframe>
        <iframe class="preview-top" src="top.html" title="Top banner"></iframe>
        <iframe class="preview-right" src="right.html" title="Right skyscraper"></iframe>
        <div class="preview-website" aria-hidden="true"></div>
        <img class="preview-debug-overlay" src="design/layout.png" alt="" aria-hidden="true">
        <div class="preview-label preview-label--left" aria-hidden="true">Fireplace_left</div>
        <div class="preview-label preview-label--top" aria-hidden="true">Fireplace_top</div>
        <div class="preview-label preview-label--right" aria-hidden="true">Fireplace_right</div>
      </div>
    </main>
    <script src="animation.js" defer></script>
  </body>
</html>
